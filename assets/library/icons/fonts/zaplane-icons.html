<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>zaplane-icons</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 10px 20px;
            text-align: center;
        }
        .preview {
            width: 100px;
            display: inline-block;
            margin: 10px;
        }
        .preview .inner {
            display: inline-block;
            width: 100%;
            text-align: center;
            background: #f5f5f5;
            -webkit-border-radius: 3px 3px 0 0;
            -moz-border-radius: 3px 3px 0 0;
            border-radius: 3px 3px 0 0;
        }
        .preview .inner  {
            line-height: 85px;
            font-size: 40px;
            color: #333;
        }
        .label {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
            font-size: 10px;
            font-family: Monaco, monospace;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: #ddd;
            -webkit-border-radius: 0 0 3px 3px;
            -moz-border-radius: 0 0 3px 3px;
            border-radius: 0 0 3px 3px;
        }
    </style>

    <link rel="stylesheet" type="text/css" href="../zaplane-icons.css" />
</head>
<body>

    <h1>zaplane-icons</h1>


        <div class="preview">
            <span class="inner">
                <i class="zaplane-icon- zaplane-icon--variable"></i>
            </span>
            <br>
            <span class='label'>variable</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="zaplane-icon- zaplane-icon--plus"></i>
            </span>
            <br>
            <span class='label'>plus</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="zaplane-icon- zaplane-icon--iterator"></i>
            </span>
            <br>
            <span class='label'>iterator</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="zaplane-icon- zaplane-icon--http-request"></i>
            </span>
            <br>
            <span class='label'>http-request</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="zaplane-icon- zaplane-icon--filter"></i>
            </span>
            <br>
            <span class='label'>filter</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="zaplane-icon- zaplane-icon--delay"></i>
            </span>
            <br>
            <span class='label'>delay</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="zaplane-icon- zaplane-icon--condition"></i>
            </span>
            <br>
            <span class='label'>condition</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="zaplane-icon- zaplane-icon--close-x"></i>
            </span>
            <br>
            <span class='label'>close-x</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="zaplane-icon- zaplane-icon--apps"></i>
            </span>
            <br>
            <span class='label'>apps</span>
        </div>


</body>
</html>
