name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - next-release

jobs:
  # Smoke: ParityTest only. Catches case-mismatched files, missing
  # classes, slug/registry drift, unauth webhook overrides, and missing
  # *Test.php for new integrations. Must stay green to merge.
  smoke:
    name: Smoke (ParityTest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php8.2-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.2-
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run smoke (ParityTest)
        run: composer test:smoke

  # Full suite. Has known latent failures from the 17 broken-integration
  # backlog — set continue-on-error: true so red doesn't block merges
  # while the backlog is worked down. Re-enable strict gating after PR #4.
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.2']
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php${{ matrix.php }}-
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Run release suite
        run: composer test:release
